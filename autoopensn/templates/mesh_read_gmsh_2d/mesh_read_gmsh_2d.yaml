name: mesh_read_gmsh_2d
description: 'Reading a 2D gmsh file. To run the code, simply type: `jupyter nbconvert
  --to python --execute <basename>.ipynb`. To convert it to a python file (named `<basename>.py`),
  simply type: `jupyter nbconvert --to python <basename>.ipynb` To run the python
  file from the terminal, using N processes, simply type: `mpiexec -n <N> python <basename>.py`
  We also partition the 2D mesh into 8 subdomains using `Parmetis` (by running using
  `mpiexec -n 8 ...`). Finally, we export the mesh to a VTU file. ![Mesh_Material](images/c5g7_coarse_material.png)
