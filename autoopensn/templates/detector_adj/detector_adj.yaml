name: detector_adj
description: 'A Multigroup Adjoint Response. In this example, we explore the use of
  an adjoint formulation of the linear Boltzmann equation to compute response functions
  in a specified region of interest (RoI). This problem builds on the corresponding
  example in [A Multigroup 1D Detector](../detector_forward/detector.ipynb). Additional
  information on the adjoint formalism can be found in the [theory manual](../../../../theory/adjoint.rst).
  The following is a complete transport simulation example. Each element of the simulation
  can be described in the sections below: - [Prerequisites](#prerequisites) - [Geometry](#geometry)
  -…'
