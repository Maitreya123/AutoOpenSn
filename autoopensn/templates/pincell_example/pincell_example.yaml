name: pincell_example
description: 'Reactor pin cell. `jupyter nbconvert --to python --execute <notebook_name>.ipynb`.
  To run this notebook in parallel (for example, using 4 processes), simply type:
  `mpiexec -n 4 jupyter nbconvert --to python --execute <notebook_name>.ipynb`. Import
  required classes and functions from the Python interface of OpenSn. Run this notebook
  from an environment where the `pyopensn` package is importable. For more accurate
  results, we suggest using `n_polar = 8` and `n_azimuthal = 32` We create an edit
  zone (logical volume) that is the entire domain. We request the average (keyword
  `"avg"`) of the scalar flux over the…'
