name: adjoint_example
description: 'A First Adjoint Example. In this example we will explore leveraging
  an adjoint formulation of the linear Boltzmann equations for computing response
  functions in a desired region of interest (RoI). The following is a complete transport
  simulation example. Each element of the simulation can be described in the sections
  below: - [Prerequisites](#prerequisites) - [Mesh](#mesh) - [Geometry](#Geometry)
  - [Material IDs](#material-ids) - [Cross Sections](#cross-sections) - [Solver](#Solver)
  - [Angular Quadrature](#angular-quadrature) - [Group Structure](#group-structure)
  - [Discrete Ordinates…'
