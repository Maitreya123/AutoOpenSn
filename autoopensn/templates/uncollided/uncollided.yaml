name: uncollided
description: '3D Uncollided+Collided Calculation on an Unstructured Mesh. This notebook
  demonstrates a complete uncollided-plus-collided fixed-source calculation on a small
  tetrahedral mesh. The problem is intentionally simple: - single energy group, -
  single material, - single point source, - serial uncollided generation followed
  by a collided solve. The mesh is a coarse tetrahedral cube (`test/assets/mesh/uncollided_cube_coarse.msh`).
  Run this notebook with the OpenSn Python module available. Because the uncollided
  stage must run with exactly one MPI rank, this end-to-end notebook should be executed
  in serial: `jupyter nbconvert --to notebook --execute…'
