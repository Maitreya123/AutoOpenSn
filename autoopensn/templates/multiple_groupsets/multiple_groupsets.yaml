name: multiple_groupsets
description: Multiple Groupsets in an Infinite-Medium. This tutorial divides a realistic
  30-group concrete calculation into three groupsets and shows how OpenSn resolves
  scattering between energy ranges. The problem uses the LANL concrete mixture represented
  with the 30-group LANL energy structure (LANL30). Its cross sections, including
  the scattering transfer matrix, are imported from OpenMC. The groupsets cover groups
  0–9, 10–19, and 20–29. Each groupset has its own inner solve, while across-groupset
  iteration (AGS) reconciles scattering contributions that cross groupset boundaries.
  A unit source is applied to group 0. Reflecting boundaries…
