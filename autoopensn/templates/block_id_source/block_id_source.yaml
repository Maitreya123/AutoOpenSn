name: block_id_source
description: Material Source Selected by Block ID. This tutorial applies a volumetric
  source to every cell carrying a selected mesh block ID. This form is useful when
  a source occupies an entire material region. The slab is two centimeters long. Cells
  in its left half are assigned block ID 1, while the remaining cells retain block
  ID 0. `VolumetricSource(block_ids=[1], ...)` then activates the source only in the
  block-1 cells. Both blocks use the same material so the example isolates source
  selection from material effects. The complete source definition is the block selection
  and one strength value for each energy group. The active block has…
