name: arbitrary_boundary_source
description: Arbitrary Angular Boundary Source. This tutorial imports a Gmsh mesh
  whose physical groups identify a boundary-source segment and uses an `AngularFluxFunction`
  to illuminate that segment only along directions inside a cone about the inward
  $+x$ direction. The imported Gmsh mesh covers the unit square. Its two-dimensional
  `Background` physical group has block ID 1, while one-dimensional physical groups
  name the exterior boundaries. The centered segment $0.4 \leq y \leq 0.6$ on the
  left edge is named `Boundary_Source`; the rest of that edge is `xmin`. Because OpenSn
  imports these physical groups as boundary IDs, no logical…
