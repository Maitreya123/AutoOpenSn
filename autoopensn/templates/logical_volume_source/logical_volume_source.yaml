name: logical_volume_source
description: Volumetric Source over a Logical Volume. This tutorial uses a logical
  volume to place a source independently of the mesh block assignments. Every cell
  belongs to block 0, but the source is active only from $z=0.5$ to $z=1.5$. Passing
  the `RPPLogicalVolume` directly to `VolumetricSource` avoids creating a separate
  material block for that region. The source definition directly associates the strength
  with the previously constructed logical volume. The selected region has unit length
  and source strength two, so its total production rate is two. Reflecting boundaries
  require the same total absorption rate. Source-setting methods add to…
