name: delta_forward
description: 'Delta-Forward Scattering and Galerkin Quadrature Methods. This tutorial
  introduces the **delta-forward scattering kernel** — the limiting case of forward-peaked
  scattering where all particles scatter exactly in their incident direction — and
  uses it to compare the **standard**, **Galerkin One**, and **Galerkin Three** operator
  construction methods in 3D. The delta-forward kernel is defined by a Dirac delta
  in the scattering angle cosine: $$ f(\mu_0) = \delta(\mu_0 - 1) $$ Its Legendre
  moments are all identically one: $$ f_\ell = P_\ell(1) = 1 \qquad \text{for all
  } \ell $$ so the scattering cross-section moments are $\sigma_{s,\ell} = \sigma_s$
  for…'
source: doc/source/tutorials/numerical_methods/angular_discretization/delta_forward.ipynb
opensn_commit: 2fd4a19ceade4f8da581a5029c68f474d3333ccb
script: delta_forward.py.j2
generated_from: numerical_methods/angular_discretization/delta_forward.ipynb
num_procs: 1
notes: 'Generated from the OpenSn tutorial numerical_methods/angular_discretization/delta_forward.ipynb
  at the pinned commit. Do not edit

  by hand: regenerate with `autoopensn scenarios --rebuild`, or the edit is lost.


  Rendering this template with every parameter at its default reproduces the

  tutorial''s script character for character, which the generator verifies before

  writing and the test suite re-checks on every run.


  34 literal(s) in the script were turned into parameters. 0 were left

  as constants because their notation could not be reproduced exactly, which is

  the conservative direction: a knob that corrupts the script is worse than a

  constant.


  A parameter whose provenance is `inferred` has a range scaled from the value the

  tutorial itself uses. That is a guard against an absurd study, not a limit the

  code enforces, and it is the first thing to widen when a legitimate study is

  rejected.

  '
