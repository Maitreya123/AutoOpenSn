name: operator_methods
description: 'Operator Construction Methods. In discrete-ordinates transport, we need
  operators to map between the angular flux (defined at discrete directions) and flux
  moments (expanded in spherical harmonics). The two key operators are: - **Discrete-to-Moment
  (D)**: computes flux moments from the angular flux. - **Moment-to-Discrete (M)**:
  reconstructs the angular flux from flux moments. OpenSn provides various methods
  for constructing these operators: 1) `standard` 2) `galerkin_one` 3) `galerkin_three`
  This tutorial demonstrates each method and compares their properties. To run the
  code, simply type: `jupyter nbconvert --to python…'
