name: isotropic_boundary_source
description: Isotropic Boundary Source and Leakage. This tutorial sends particles
  into a two-dimensional, purely absorbing square through an isotropic boundary condition
  and measures leakage through its three vacuum boundaries. The square has unit width
  and height and a unit total cross section with no scattering. A two-dimensional
  product quadrature resolves directions in the $x$-$y$ plane. The `xmin` boundary
  supplies an isotropic group strength of two. The opposite boundary and both horizontal
  boundaries are vacuum, so particles can be transmitted through `xmax` or leak through
  `ymin` and `ymax`. Unlike point and volumetric sources, a…
