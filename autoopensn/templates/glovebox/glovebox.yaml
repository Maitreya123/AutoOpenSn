name: glovebox
description: 'A Multigroup 2D Glovebox. In this example, we use OpenSn’s linear Boltzmann
  solver to compute response functions in two Helium-3 detectors within a mockup 2D
  glovebox. The following is a complete transport simulation example. Each element
  of the simulation can be described in the sections below: - [Prerequisites](#prerequisites)
  - [Geometry](#Geometry) - [Mesh](#mesh) - [Cross Sections](#cross-sections) - [Solver](#Solver)
  - [Angular Quadrature](#angular-quadrature) - [Group Structure](#group-structure)
  - [Source Definition](#source-definition) - [Discrete Ordinates Problem](#discrete-ordinates-problem)
  -…'
source: doc/source/tutorials/applications/detector_response/glovebox_forward/glovebox.ipynb
opensn_commit: 2fd4a19ceade4f8da581a5029c68f474d3333ccb
script: glovebox.py.j2
generated_from: applications/detector_response/glovebox_forward/glovebox.ipynb
num_procs: 8
notes: 'Generated from the OpenSn tutorial applications/detector_response/glovebox_forward/glovebox.ipynb
  at the pinned commit. Do not edit

  by hand: regenerate with `autoopensn scenarios --rebuild`, or the edit is lost.


  Rendering this template with every parameter at its default reproduces the

  tutorial''s script character for character, which the generator verifies before

  writing and the test suite re-checks on every run.


  106 literal(s) in the script were turned into parameters. 0 were left

  as constants because their notation could not be reproduced exactly, which is

  the conservative direction: a knob that corrupts the script is worse than a

  constant.


  A parameter whose provenance is `inferred` has a range scaled from the value the

  tutorial itself uses. That is a guard against an absurd study, not a limit the

  code enforces, and it is the first thing to widen when a legitimate study is

  rejected.

  '
