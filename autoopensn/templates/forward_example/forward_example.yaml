name: forward_example
description: 'A Simple Example. This is a complete simulation transport example. Each
  aspect of the simulation process is kept to a minimum: - We use an orthogonal 2D
  grid; - We introduce the concept of domain decomposition ("partitioning"); - The
  domain is homogeneous (single material, uniform isotropic external source), vacuum
  boundary conditions apply; - The cross sections are given in a text file (with our
  OpenSn format); we use only one energy group in this example; - The angular quadrature
  (discretization in angle) is introduced; - The Linear Boltzmann Solver (LBS) options
  are keep to a minimum. `jupyter nbconvert…'
