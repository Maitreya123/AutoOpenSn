name: cmfd
description: 'CMFD acceleration for k-eigenvalue problems. This tutorial demonstrates
  how to add coarse-mesh finite-difference (CMFD) acceleration to a multigroup k-eigenvalue
  transport solve. The runnable problem is intentionally small so the notebook finishes
  quickly, but the CMFD setup mirrors the workflow used by larger production inputs.
  The focus is the CMFD accelerator object: - when to use CMFD, - how to construct
  `CMFDAcceleration`, - what the user-facing options mean, - which options to tune
  first, - how to interpret the CMFD status lines, - what to do when CMFD skips a
  correction or converges slowly. The mesh, cross sections, quadrature,…'
source: doc/source/tutorials/problems/eigenvalue/cmfd.ipynb
