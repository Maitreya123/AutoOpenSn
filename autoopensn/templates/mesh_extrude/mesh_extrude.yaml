name: mesh_extrude
description: 'Reading a 2D mesh file and extruding it. To run the code, simply type:
  `jupyter nbconvert --to python --execute <basename>.ipynb`. To convert it to a python
  file (named `<basename>.py`), simply type: `jupyter nbconvert --to python <basename>.ipynb`
  To run the python file from the terminal, using N processes, simply type: `mpiexec
  -n <N> python <basename>.py` We insert 2 layers between z=0 and z=1.1, followed
  by 3 layers, between z=1.1 and z=2.1. We partition the mesh using Parmetis (and
  6 processors). Finally, we export the mesh to a VTU file. The resulting mesh and
  material layout is shown below:…'
