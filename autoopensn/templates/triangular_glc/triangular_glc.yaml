name: triangular_glc
description: 'Triangular Quadrature. To run the code, simply type: `jupyter nbconvert
  --to python --execute <basename>.ipynb`. To convert it to a python file (named `<basename>.py`),
  simply type: `jupyter nbconvert --to python <basename>.ipynb` Here, we use a Triangular
  Quadrature for two-dimensional geometries. We pick a quadrature set with 4 polar
  angles. Unlike a product quadrature, the number of azimuthal angles varies per polar
  level: the maximum is $2 \times N_{polar} = 8$ at the equator, decreasing by 4 (one
  per quadrant) for each polar level toward the pole. For 2D (upper hemisphere only
  with 2 polar levels), the…'
