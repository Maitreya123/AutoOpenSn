name: adjoint_logical_volume_source
description: Adjoint Source over a Logical Volume. This tutorial defines an adjoint
  source over a response region and explicitly enables adjoint mode in the transport
  problem. **Audience:** Users preparing adjoint calculations for response evaluation.
  **Prerequisites:** Logical-volume sources and the introductory adjoint problem.
  The background has $\sigma_t=1.0$ and scattering ratio $c=0.8$. A separate response
  region spanning $1.0 \le z \le 1.5$ has $\sigma_t=1.5$ and $c=0.1$. The logical
  volume assigns this region its own mesh block and also identifies where the response
  source is applied. At the input level, adjoint sources are defined…
