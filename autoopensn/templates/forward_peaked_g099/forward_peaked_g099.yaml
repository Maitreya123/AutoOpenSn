name: forward_peaked_g099
description: 'Very Strong Forward-Peaked Scattering. In this tutorial, we will discuss
  the challenges associated with highly forward-peaked cross sections. For this exercise,
  a Henyey-Greenstein (HG) cross section expansion will be assumed. $$ f(\mu) = \frac{1
  - g^2}{2(1 + g^2 - 2g\mu)^{3/2}} $$ We choose the HG function for this due to its
  simple expansion in terms of the Legendre polynomials $P_n$: $$ f(\mu_0) = \sum_{\ell=0}^{\infty}
  \frac{2\ell+1}{2}\, g^\ell\, P_\ell(\mu_0) $$ so the Legendre moments are simply
  $f_\ell = g^\ell$. This closed-form result means that the convergence rate of the
  Legendre expansion is entirely determined by how…'
