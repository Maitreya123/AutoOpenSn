name: first_2d_fixed_source
description: Your First 2D Fixed-Source Calculation. This notebook extends the one-dimensional
  slab calculation to a square Cartesian domain. You will create a two-dimensional
  mesh, name its orthogonal boundaries, choose a quadrature appropriate to 2D Cartesian
  transport, solve a one-group fixed-source problem, and verify the scalar flux. **Prerequisite:**
  [Your First 1D Fixed-Source Calculation](first_1d_fixed_source.ipynb). Supplying
  two node sets creates a Cartesian mesh in the $x$-$y$ plane. `SetOrthogonalBoundaries`
  assigns the names `xmin`, `xmax`, `ymin`, and `ymax`; the problem uses vacuum conditions
  on all four by default. As in the 1D…
