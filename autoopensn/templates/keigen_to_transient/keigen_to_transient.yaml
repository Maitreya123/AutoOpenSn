name: keigen_to_transient
description: 'Switching From Steady-State Mode to Transient Mode in OpenSn. `jupyter
  nbconvert --to python --execute keigen_to_transient_tutorial.ipynb` To run in parallel
  (for example, 4 ranks): `mpiexec -n 4 jupyter nbconvert --to python --execute keigen_to_transient_tutorial.ipynb`
  We construct a simple 3D Cartesian mesh with 64 cells using the built-in orthogonal
  mesh generator. The dimensions of the mesh are 8cm in each dimension. When using
  the built-in mesh generator, no material IDs are assigned. We assign a material
  ID with value 0 for each cell in the spatial domain. - `xs_crit` for the steady-state
  k-eigen solve - `xs_super` for the transient reactivity…'
source: doc/source/tutorials/problems/transient/keigen_to_transient.ipynb
