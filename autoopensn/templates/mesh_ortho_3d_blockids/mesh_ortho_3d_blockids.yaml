description: '3D Orthogonal Grid Generation with multiple block IDs. However, we assign
  several block IDs. To run the code, simply type: `jupyter nbconvert --to python
  --execute <basename>.ipynb`. To convert it to a python file (named `<basename>.py`),
  simply type: `jupyter nbconvert --to python <basename>.ipynb` To run the python
  file from the terminal, using N processes, simply type: `mpiexec -n <N> python <basename>.py`
  We create a list of mesh nodes that are evenly spaced from 0 to +L. These nodes
  are the standard ones, used to define the vertices of our computational grid. We
  create a function factory to create a material ID function for a given (i, j, k)…'
