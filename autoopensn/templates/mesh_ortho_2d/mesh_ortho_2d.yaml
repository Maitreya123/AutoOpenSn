name: mesh_ortho_2d
description: '2D Orthogonal Grid Generation. To run the code, simply type: `jupyter
  nbconvert --to python --execute mesh_ortho_2D.ipynb`. To convert it to a python
  file (named `mesh_ortho_2D.py`), simply type: `jupyter nbconvert --to python mesh_ortho_2D.ipynb`
  To run the python file from the terminal, using N processes, simply type: `mpiexec
  -n <N> python mesh_ortho_2D.py` The domain will be partitioned using the `KBAGraphPartitioner`
  into 4 subdomains and the locations of the plane cuts along x and y need to be specified.
  In Python script mode, PyOpenSn automatically handles environment termination. However,
  this automatic…'
