name: source_step_steady_to_transient_to_steady
description: 'Switching From Steady-State to Transient to Steady-State in OpenSn.
  `jupyter nbconvert --to python --execute source_step_steady_to_transient_to_steady.ipynb`
  To run in parallel (for example, 4 ranks): `mpiexec -n 4 jupyter nbconvert --to
  python --execute source_step_steady_to_transient_to_steady.ipynb` We construct a
  1D Cartesian mesh (10 cells on \([0,1]\)) so this tutorial focuses on workflow behavior
  rather than geometry complexity. Assign a single material ID (`0`) to all cells.
  Use a one-group pure absorber model: $$\Sigma_t = 1.0$$ $$\Sigma_s = 0.0$$ For this
  setup, the steady source-driven solution is $$\phi_{ss} = Q / \Sigma_t$$. 1. steady-state…'
