name: xs_read_ascii
description: 'Reading OpenSn ASCII cross sections. OpenSn''s native cross-section
  format is a plain-text format intended for readable, version-controlled material
  data. This tutorial introduces the structure of a non-fissionable file, loads a
  two-group example, and inspects the resulting `MultiGroupXS` object. The same `LoadFromOpenSn`
  call is used for one-group and multigroup files; the `NUM_GROUPS` entry in the file
  determines the number of groups. A minimal OpenSn ASCII cross-section file declares
  its number of energy groups and scattering moments, followed by one or more data
  blocks: SIGMA_T_BEGIN <group> <total cross section> SIGMA_T_END…'
