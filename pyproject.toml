[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoopensn"
version = "0.1.0"
description = "A workflow engine for parameter studies with the OpenSn neutron transport code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.6",
    "jinja2>=3.1",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
ui = ["streamlit>=1.40", "altair>=5.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
autoopensn = "autoopensn.cli:main"

[tool.setuptools.packages.find]
include = ["autoopensn*"]

[tool.setuptools.package-data]
autoopensn = ["templates/**/*.j2", "templates/**/*.yaml", "narrate/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:autoopensn.*"]
